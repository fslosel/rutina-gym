<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');

  :root{
    --bg: #14261f;
    --card: #1d3830;
    --card2: #234238;
    --chalk: #eef3ee;
    --dim: #a9bdb2;
    --tape: #e8b23c;
    --danger: #e2694b;
    --ok: #6fbf8b;
    --line: rgba(238,243,238,0.14);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}

  body{
    margin:0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Barlow', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  /* ---- App shell ---- */
  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    background: var(--bg);
    position:relative;
  }

  .topbar{
    position: sticky;
    top:0;
    z-index: 5;
    background: var(--bg);
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
  }

  .topbar .eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--tape);
    font-size: 11px;
    font-weight: 700;
  }

  .topbar h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.02em;
    margin: 2px 0 10px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .progress-bar{
    flex:1;
    height: 6px;
    background: rgba(238,243,238,0.1);
    border-radius: 4px;
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    background: var(--tape);
    width: 0%;
    transition: width .25s ease;
  }

  .progress-label{
    font-size: 12px;
    color: var(--dim);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    white-space:nowrap;
  }

  /* ---- Content ---- */
  .content{
    flex:1;
    padding: 16px 16px 100px;
  }

  .day-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin: 6px 4px 14px;
  }

  .day-heading .title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size: 16px;
    letter-spacing: 0.03em;
    text-transform:uppercase;
    color: var(--dim);
  }

  .day-heading .count{
    font-size: 12px;
    color: var(--dim);
    font-family:'Barlow Condensed', sans-serif;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow:hidden;
    transition: opacity .2s ease;
  }

  .card.done{ opacity: 0.55; }

  .card-head{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 14px 14px;
    cursor:pointer;
  }

  .icon-wrap{
    width: 52px;
    height: 52px;
    background: rgba(238,243,238,0.06);
    border: 1px solid var(--line);
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .icon-wrap svg{ width: 34px; height: 34px; }

  .card-titles{ flex:1; min-width:0; }

  .ex-name{
    font-family:'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    line-height:1.25;
  }

  .ex-sets{
    font-size: 12.5px;
    color: var(--tape);
    font-weight:600;
    margin-top: 2px;
  }

  .check{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: transparent;
    font-size: 14px;
  }

  .card.done .check{
    background: var(--ok);
    border-color: var(--ok);
    color: #0c1e16;
  }

  .chevron{
    color: var(--dim);
    font-size: 18px;
    flex-shrink:0;
    transition: transform .2s ease;
  }

  .card.open .chevron{ transform: rotate(180deg); }

  .card-body{
    max-height:0;
    overflow:hidden;
    transition: max-height .25s ease;
    padding: 0 16px;
  }

  .card.open .card-body{
    max-height: 600px;
    padding: 0 16px 16px;
  }

  .note{
    display:inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 2px 8px;
    border-radius: 4px;
    margin: 2px 0 10px;
  }

  .how, .avoid{
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 10px;
    color: var(--dim);
  }
  .how b{ color: var(--chalk); font-weight:600; }
  .avoid{ color: #f2c9bd; }
  .avoid b{ color: var(--danger); font-weight:600; }

  .photo-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width:100%;
    padding: 11px;
    background: rgba(232,178,60,0.12);
    border: 1px solid var(--tape);
    color: var(--tape);
    border-radius: 9px;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size: 14px;
    text-decoration:none;
    margin-top: 2px;
  }

  .photo-btn:active{ background: rgba(232,178,60,0.22); }

  /* ---- Bottom tab bar ---- */
  .tabbar{
    position: fixed;
    bottom:0;
    left:0; right:0;
    max-width: 480px;
    margin: 0 auto;
    display:flex;
    background: #102019;
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 10;
  }

  .tab{
    flex:1;
    text-align:center;
    padding: 12px 4px 10px;
    color: var(--dim);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size: 13px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    border-top: 2px solid transparent;
  }

  .tab.active{
    color: var(--tape);
    border-top-color: var(--tape);
  }

  .tab .sub{
    display:block;
    font-family:'Barlow', sans-serif;
    font-weight:400;
    text-transform:none;
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing:0;
    margin-top:2px;
  }

  .foot-note{
    text-align:center;
    color: var(--dim);
    font-size: 12px;
    padding: 4px 20px 12px;
    line-height:1.5;
  }
</style>
</head>

let currentDay = 1;
// done[dayId] = Set of exercise indices marked complete (in-memory only, resets on reload)
const done = { 1: new Set(), 2: new Set(), 3: new Set() };
// open[dayId] = index of currently expanded card, or -1
const openCard = { 1: -1, 2: -1, 3: -1 };

function renderTabbar(){
  const tabbar = document.getElementById('tabbar');
  tabbar.innerHTML = DAYS.map(d => `
    <div class="tab ${d.id === currentDay ? 'active' : ''}" onclick="switchDay(${d.id})">
      ${d.label}
      <span class="sub">${d.sub}</span>
    </div>
  `).join('');
}

function switchDay(id){
  currentDay = id;
  renderTabbar();
  renderContent();
}

function toggleDone(dayId, idx, ev){
  ev.stopPropagation();
  const set = done[dayId];
  if(set.has(idx)) set.delete(idx); else set.add(idx);
  renderContent();
}

function toggleOpen(dayId, idx){
  openCard[dayId] = openCard[dayId] === idx ? -1 : idx;
  renderContent();
}

function renderContent(){
  const day = DAYS.find(d => d.id === currentDay);
  const content = document.getElementById('content');
  const doneSet = done[currentDay];

  content.innerHTML = `
    <div class="day-heading">
      <div class="title">${day.sub}</div>
      <div class="count">${doneSet.size}/${day.exercises.length} completados</div>
    </div>
    ${day.exercises.map((ex, idx) => {
      const isDone = doneSet.has(idx);
      const isOpen = openCard[currentDay] === idx;
      const searchUrl = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(ex.query);
      return `
        <div class="card ${isDone ? 'done' : ''} ${isOpen ? 'open' : ''}">
          <div class="card-head" onclick="toggleOpen(${currentDay}, ${idx})">
            <div class="icon-wrap">
              <svg viewBox="0 0 100 100" fill="none" stroke="#eef3ee" stroke-width="3" stroke-linecap="round">${ex.icon}</svg>
            </div>
            <div class="card-titles">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-sets">${ex.sets}</div>
            </div>
            <div class="check" onclick="toggleDone(${currentDay}, ${idx}, event)">${isDone ? '✓' : ''}</div>
            <div class="chevron">▾</div>
          </div>
          <div class="card-body">
            ${ex.flag ? `<div class="note">${ex.flag}</div>` : ``}
            <p class="how"><b>Cómo hacerlo:</b> ${ex.how}</p>
            <p class="avoid"><b>Evitar:</b> ${ex.avoid}</p>
            <a class="photo-btn" href="${searchUrl}" target="_blank" rel="noopener">📷 Ver fotos reales</a>
          </div>
        </div>
      `;
    }).join('')}
  `;

  const totalDone = Object.values(done).reduce((a,s) => a + s.size, 0);
  const totalEx = DAYS.reduce((a,d) => a + d.exercises.length, 0);
  document.getElementById('progressLabel').textContent = `${doneSet.size}/${day.exercises.length} hoy`;
  document.getElementById('progressFill').style.width = (doneSet.size / day.exercises.length * 100) + '%';
}

renderTabbar();
renderContent();
</script>
